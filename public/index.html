<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IGEL Web Defender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <main class="shell">
      <header class="hero card reveal">
        <p class="kicker">Threat Intel Workbench</p>
        <h1>IGEL Web Defender 1.0</h1>
        <p class="hero-copy">
          Search CVEs from NVD, then compare likely endpoint impact across Windows and IGEL OS.
        </p>
      </header>

      <section class="search card reveal">
        <form id="search-form" autocomplete="off">
          <label for="query" class="label">CVE Query</label>
          <div class="search-row">
            <input
              id="query"
              name="query"
              type="text"
              placeholder="Try CVE-2021-34527 or OpenSSL"
              required
            />
            <button type="submit">Search</button>
          </div>
        </form>
        <p id="status" class="status">Ready.</p>
      </section>

      <section id="results" class="results reveal"></section>

      <section id="analysis" class="analysis hidden">
        <article class="summary card reveal">
          <h2>Exploit Summary</h2>
          <p id="exploit-summary"></p>
          <p id="confidence" class="confidence"></p>
        </article>

        <div class="compare-grid">
          <article class="impact windows card reveal">
            <h3>Windows</h3>
            <p id="windows-state" class="state"></p>
            <p id="windows-assessment"></p>
            <p id="windows-mitigation" class="mitigation"></p>
          </article>

          <article class="impact igel card reveal">
            <h3>IGEL OS</h3>
            <p id="igel-state" class="state"></p>
            <p id="igel-assessment"></p>
            <p id="igel-mitigation" class="mitigation"></p>
          </article>
        </div>

        <article class="disclaimer card reveal">
          <h4>Advisory Note</h4>
          <p id="disclaimer"></p>
        </article>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
