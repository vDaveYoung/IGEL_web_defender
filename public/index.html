<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edge Defender: Sector Wars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="nebula" aria-hidden="true"></div>
    <main class="app-shell">
      <header class="brand-panel panel">
        <p class="eyebrow">IGEL Conference Experience</p>
        <h1>Edge Defender: Sector Wars</h1>
        <p class="subtitle">Protect mission-critical edge systems against cyber assaults using IGEL defensive powers.</p>
        <div class="brand-actions">
          <button id="help-open" type="button" class="help-btn">How to Play</button>
        </div>
      </header>

      <section id="lead-screen" class="panel screen active">
        <h2>Step 1: Lead Capture</h2>
        <form id="lead-form" class="lead-grid">
          <input id="firstName" placeholder="First Name" required />
          <input id="lastName" placeholder="Last Name" required />
          <input id="company" placeholder="Company" required />
          <input id="email" placeholder="Email" type="email" required />
          <input id="jobRole" placeholder="Job Role (optional)" />
          <label class="checkbox-row">
            <input id="optIn" type="checkbox" />
            <span>I consent to follow-up communications.</span>
          </label>
          <button type="submit">Continue to Missions</button>
        </form>
      </section>

      <section id="mission-screen" class="panel screen">
        <h2>Step 2: Choose Mission</h2>
        <div id="mission-grid" class="mission-grid"></div>
      </section>

      <section id="game-screen" class="panel screen">
        <div class="hud">
          <div class="stats">
            <span id="timer">75s</span>
            <span id="score">Score: 0</span>
            <span id="threats">Threats Stopped: 0</span>
            <span id="saved">Endpoints Saved: 5</span>
          </div>
          <div id="capabilities" class="capabilities"></div>
        </div>
        <canvas id="game-canvas" width="960" height="540" aria-label="Sector Wars game board"></canvas>
      </section>

      <section id="result-screen" class="panel screen">
        <h2>Mission Report</h2>
        <div id="summary" class="summary"></div>
        <div class="result-actions">
          <button id="play-again">Run Another Mission</button>
          <a class="cta" href="#" id="demo-link">Book a Demo</a>
        </div>

        <h3>Leaderboard</h3>
        <div class="leaderboard-tabs">
          <button data-board="mission" class="board-tab active">Mission</button>
          <button data-board="all" class="board-tab">Event</button>
        </div>
        <div id="leaderboard" class="leaderboard"></div>
      </section>

      <section id="tutorial-overlay" class="tutorial-overlay hidden" aria-live="polite" aria-modal="true" role="dialog">
        <article class="tutorial-card">
          <h2>How to Play</h2>
          <p id="tutorial-step" class="tutorial-step"></p>
          <div class="tutorial-actions">
            <button id="tutorial-next" type="button">Next</button>
            <button id="tutorial-skip" type="button" class="tutorial-skip">Skip</button>
          </div>
        </article>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
